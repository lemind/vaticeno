name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: vaticeno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/vaticeno
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Coverage is reported, never enforced: ~55% is a cap, not a floor.
      - run: npm run test:coverage
      - run: npm run db:migrate
      - run: npm run test:integration
      # 60 historical price claims on frozen candles (SC-002: must be 100%)
      - run: npm run seeds:crypto
      # Ten times the live mention rate, answered once each (003 SC-004)
      - run: npm run load:burst
      # The settlement worker against a local chain and this job's migrated database (003 T333, T334).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - run: pip install ".[settle,dev]"
      - run: pytest settle
        env:
          REQUIRE_CHAIN_TESTS: '1'
      # The wager page's hand-encoded calls against the compiled contract and `cast` (003 T371a).
      - run: forge build --root contracts
      - run: npm run test:abi

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install ".[status,load,dev]"
      - run: ruff check .
      # Exit 5 is pytest's "no tests collected": status/ and load/ fill in later phases of Stage 1 (FR-021).
      - run: pytest status load || [ $? -eq 5 ]

  # The escrow (003 Stage 2). Every branch of every transition, plus the operator trying to move funds.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - run: forge build
      - run: forge lint -D warnings
      - run: forge test
