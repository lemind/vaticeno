name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: vaticeno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/vaticeno
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Coverage is reported, never enforced: ~55% is a cap, not a floor.
      - run: npm run test:coverage
      - run: npm run db:migrate
      - run: npm run test:integration
      # 60 historical price claims on frozen candles (SC-002: must be 100%)
      - run: npm run seeds:crypto

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install ".[status,load,dev]"
      - run: ruff check .
      # Exit 5 is pytest's "no tests collected": status/ and load/ fill in later phases of Stage 1 (FR-021).
      - run: pytest status load || [ $? -eq 5 ]

