name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: vaticeno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/vaticeno
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Coverage is reported, never enforced: ~55% is a cap, not a floor.
      - run: npm run test:coverage
      - run: npm run db:migrate
      - run: npm run test:integration
      # Recorded model answers, no key needed (SC-001: ≥ 90%)
      - run: npm run corpus
      # Added when its task lands: `npm run seeds:crypto` (replay mode).
