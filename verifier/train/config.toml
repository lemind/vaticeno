# The supervised baseline (003 T343a, decision 004). Changing a number here is a new run, named by its output.
max_length = 128          # premise + hypothesis + special tokens; longer pairs lose tokens from the longer side
truncation = "longest_first"
batch_size = 32           # dynamic padding to the longest pair in the batch
learning_rate = 2e-5
weight_decay = 0.01
warmup_share = 0.06
epochs = 3
eval_every_steps = 2000   # on the development split; the best checkpoint is kept
patience = 3              # evaluations without improvement before stopping early
threads = 4               # CPU torch threads: 4 to 14 within 15%, 20 four times slower (2026-10-23)
